# Publishes BanterGPT to GitHub Pages when Settings → Pages → Source is "GitHub Actions".
# (With "Deploy from a branch" the repo root is served as-is, which also works.)
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site
        run: |
          mkdir -p _site/src
          cp index.html .nojekyll _site/
          cp -r public _site/
          # only the browser-safe engine files; llm.js needs a server and an API key
          cp src/censor.js src/custom.js src/emitter.js src/engine.js src/moderation.js src/offline.js src/personas.js _site/src/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
